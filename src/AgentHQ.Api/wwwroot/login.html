<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent HQ — sign in</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a303c; --text:#e6e9ef; --muted:#9aa3b2; --accent:#5b8cff; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         display:grid; place-items:center; min-height:100vh; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:28px 32px; width:min(320px,90vw); }
  h1 { margin:0 0 4px; font-size:18px; display:flex; gap:8px; align-items:center; }
  .logo { background:var(--accent); color:#fff; border-radius:6px; font-size:12px; font-weight:700; padding:3px 7px; }
  p { color:var(--muted); font-size:12px; margin:0 0 18px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
          border-radius:6px; padding:8px 10px; font-size:14px; }
  input:focus { outline:1px solid var(--accent); }
  button { width:100%; margin-top:20px; background:var(--accent); color:#fff; border:0; border-radius:6px;
           padding:9px 12px; font-size:14px; font-weight:600; cursor:pointer; }
  #err { color:var(--bad); font-size:12px; margin-top:12px; min-height:16px; }
</style>
</head>
<body>
<form id="f">
  <h1><span class="logo">AH</span> Agent HQ</h1>
  <p>Sign in to continue. Sessions are cookie-based.</p>
  <label>Username<input id="u" autocomplete="username" required></label>
  <label>Password<input id="p" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
  <div id="err"></div>
</form>
<script>
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("err");
    err.textContent = "";
    try {
      const res = await fetch("/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: document.getElementById("u").value.trim(),
                               password: document.getElementById("p").value, grant: "cookie" })
      });
      if (res.ok) { location.href = "/"; return; }
      err.textContent = res.status === 429 ? "Too many attempts — wait five minutes."
                                            : "Wrong username or password.";
    } catch { err.textContent = "Could not reach the hub."; }
  });
</script>
</body>
</html>
